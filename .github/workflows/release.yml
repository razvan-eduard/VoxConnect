name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "pyproject.toml"
  workflow_dispatch: {}

# Overlapping triggers for the same tag (a manual dispatch landing while a
# push-triggered build for the same version is still running) would otherwise
# race the force-tag-push and the delete/recreate-release steps below —
# queue instead of racing. cancel-in-progress stays false: a queued run is a
# real release attempt that should still complete on its turn, not
# disposable work to cancel.
concurrency:
  group: voxconnect-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compute.outputs.should_build }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release tag / version-bump gate
        id: compute
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            SHOULD_BUILD=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="v${CURRENT_VERSION}"
            SHOULD_BUILD=true
          else
            PREV_VERSION=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep -m1 '^version' | sed -E 's/version = "(.*)"/\1/' || echo "")
            if [[ "$PREV_VERSION" == "$CURRENT_VERSION" ]]; then
              SHOULD_BUILD=false
              TAG=""
            else
              SHOULD_BUILD=true
              TAG="v${CURRENT_VERSION}"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.should_build != 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: VoxConnect-windows
            # keyring discovers its backend via setuptools entry points, which
            # PyInstaller's static import analysis typically misses — without
            # this, the packaged binary can't find a keyring backend at runtime.
            pyinstaller_args: --windowed --onefile --name VoxConnect --hidden-import keyring.backends.Windows
          - os: macos-latest
            artifact_name: VoxConnect-macos
            pyinstaller_args: --windowed --onefile --name VoxConnect --hidden-import keyring.backends.macOS
          - os: ubuntu-latest
            artifact_name: VoxConnect-linux
            pyinstaller_args: --onefile --name VoxConnect --hidden-import keyring.backends.SecretService
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller ${{ matrix.pyinstaller_args }} src/voxconnect/app.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: [gate, build]
    if: needs.gate.outputs.should_build != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Force-move release tag to this commit
        run: |
          set -euo pipefail
          TAG="${{ needs.gate.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Delete existing release for a fresh publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ needs.gate.outputs.tag }}" --yes || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          files: dist-artifacts/**/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
