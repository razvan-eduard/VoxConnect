[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxconnect"
version = "0.1.0"
description = "Desktop companion app for Vox Commander — live widgets, commands, and media control over local WiFi"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Razvan Eduard" }]

dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "websockets>=12.0",
    "cryptography>=42.0",
    "opencv-python>=4.9",
    "pyzbar>=0.1.9",
    "platformdirs>=4.2",
    "keyring>=25.0",
]

[project.optional-dependencies]
mock = ["aiohttp>=3.9"]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.scripts]
voxconnect = "voxconnect.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxconnect"]
